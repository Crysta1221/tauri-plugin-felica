[package]
name = "tauri-plugin-felica"
version = "0.1.0"
authors = [ "Crysta1221" ]
description = "Tauri v2 plugin to read unencrypted FeliCa card data with Sony PaSoRi readers"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/src/typescript", "/node_modules"]
links = "tauri-plugin-felica"
build = "src/rust/build.rs"

[lib]
path = "src/rust/lib.rs"

[dependencies]
tauri = { version = "2.11.5" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
rusb = "0.9.4"
hex = "0.4.3"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

